<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双色球智能选号助手</title>
    <style>
        :root {
            --red-color: #e53935;
            --red-glow: #ff5252;
            --gold-color: #ffb300;
            --gold-glow: #ffca28;
            --blue-color: #1e88e5;
            --blue-glow: #42a5f5;
            --bg-color: #f2f4f8;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-reg: #7f8c8d;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
        }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .title {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 16px;
        }
        .latest-info {
            text-align: center;
            margin-bottom:16px;
        }
        .ball-wrap {
            display: flex;
            gap:10px;
            justify-content:center;
            flex-wrap:wrap;
            margin:16px 0;
        }
        .red-ball {
            width:44px;
            height:44px;
            border-radius:50%;
            background:var(--red-color);
            color:#fff;
            display:flex;
            align-items:center;
            justify-content:center;
            font-weight:bold;
            box-shadow: 0 0 8px var(--red-glow);
        }
        .blue-ball {
            width:44px;
            height:44px;
            border-radius:50%;
            background:var(--blue-color);
            color:#fff;
            display:flex;
            align-items:center;
            justify-content:center;
            font-weight:bold;
            box-shadow: 0 0 8px var(--blue-glow);
        }
        .btn {
            display:block;
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            background:#3498db;
            color:white;
            font-size:17px;
            cursor:pointer;
            margin:8px 0;
        }
        .history-item {
            padding:10px 0;
            border-bottom:1px solid #eee;
        }
        .tip {
            color:var(--text-reg);
            font-size:13px;
            text-align:center;
            margin-top:10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="title">双色球智能选号助手</div>
            <div class="latest-info">
                <div>最新一期：<span id="period">加载中...</span></div>
                <div class="ball-wrap" id="ballBox"></div>
            </div>
            <button class="btn" onclick="loadSsqData()">🔄 刷新开奖数据</button>
            <button class="btn" onclick="randomNum()">🎲 机选一组号码</button>
        </div>
        <div class="card">
            <div style="font-weight:bold;margin-bottom:12px;">最近10期历史</div>
            <div id="historyList"></div>
        </div>
        <div class="tip">温馨提示：彩票纯娱乐，理性购彩</div>
    </div>

<script>
// 你的Cloudflare Worker代理地址
const PROXY_URL = "https://lottery-proxy-1106293639.workers.dev/?target=https://www.cwl.gov.cn/cwl_admin/front/cwlkj/search/kjxx/findDrawNotice?name=ssq&issueCount=10";

// 拉取开奖数据
async function loadSsqData() {
    try {
        const res = await fetch(PROXY_URL);
        if (!res.ok) throw new Error("接口请求失败");
        const jsonData = await res.json();
        const arr = jsonData.result;
        if(!arr || arr.length ===0) {
            alert("没有拿到开奖数据");
            return;
        }
        // 最新一期
        const latest = arr[0];
        document.getElementById("period").innerText = latest.code + "期";
        const redArr = latest.red.split(",");
        const blue = latest.blue;
        let html = "";
        redArr.forEach(n=>{
            html += `<div class="red-ball">${n}</div>`
        })
        html += `<div class="blue-ball">${blue}</div>`
        document.getElementById("ballBox").innerHTML = html;

        // 渲染历史列表
        let historyHtml = "";
        arr.forEach(item=>{
            historyHtml += `
            <div class="history-item">
                ${item.code}期｜红球：${item.red}｜蓝球：${item.blue}
            </div>
            `
        })
        document.getElementById("historyList").innerHTML = historyHtml;
    } catch(e) {
        console.error(e);
        alert("数据拉取失败："+e.message);
    }
}

// 机选号码
function randomNum() {
    let redPool = Array.from({length:33}, (_,i)=>i+1);
    let red = [];
    for(let i=0;i<6;i++){
        let r = Math.floor(Math.random() * redPool.length);
        red.push(redPool.splice(r,1)[0]);
    }
    red.sort((a,b)=>a-b);
    let blue = Math.floor(Math.random()*16)+1;
    alert(`机选结果：\n红球：${red.join(",")}\n蓝球：${blue}`);
}

// 页面打开自动加载
window.onload = loadSsqData;
</script>
</body>
</html>
